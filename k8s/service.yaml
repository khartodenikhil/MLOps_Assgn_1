apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  # On Docker Desktop a LoadBalancer is published on localhost.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-disease-api
  ports:
    - name: http
      port: 8080
      targetPort: http
