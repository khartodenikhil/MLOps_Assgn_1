name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ------------------------------------------------------------------------ #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linter
        run: pip install -r requirements-test.txt

      - name: Ruff
        run: ruff check . --output-format=github

  # ------------------------------------------------------------------------ #
  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests with coverage
        run: >
          pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            reports/coverage.xml

  # ------------------------------------------------------------------------ #
  train:
    name: Train and validate model
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Keep committed metrics as a baseline
        run: cp reports/metrics.json reports/metrics_committed.json

      - name: Download and validate data
        run: python -m src.data --force

      - name: Train models (MLflow logs to a local SQLite store)
        run: python -m src.train

      - name: Smoke-test prediction
        run: python -m src.predict --input samples/patients.json

      # Informational: tiny floating-point differences between Windows and
      # Linux can change results slightly, so this step never fails the build.
      - name: Compare with committed metrics
        continue-on-error: true
        run: python scripts/compare_metrics.py reports/metrics_committed.json reports/metrics.json

      - name: Write job summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pandas as pd

          summary = json.load(open("reports/metrics.json"))
          table = pd.read_csv("reports/model_comparison.csv")

          print("## Model comparison\n")
          print("| " + " | ".join(table.columns) + " |")
          print("|" + "---|" * len(table.columns))
          for row in table.itertuples(index=False):
              print("| " + " | ".join(str(v) for v in row) + " |")
          print(f"\n**Selected model:** {summary['selected_model']} "
                f"(highest CV {summary['selection_metric']})")
          EOF

      - name: Upload model, reports and MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          retention-days: 14
          path: |
            models/
            reports/
            mlruns/
            mlflow.db
